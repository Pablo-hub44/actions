name: hola mundo #nombre del workflow, aca en la carpeta .github/workflows es donde se guardan los workflows para que github los detecte y ejecute automaticamente
on: #on push especifica que se ejecute cuando se haga push
  push:
    branches:
      - main #especificamos que rama queremos que escuche cuando se haga push , e igual con pull_request
  pull_request:
    branches: #especificamos que rama queremos que escuche cuando se haga pull_request
      - main
jobs: #jobs es un arreglo de trabajos que se ejecutan en paralelo 
  hola:
    runs-on: ubuntu-latest

    steps: #pasos que se ejecutan en el trabajo
      - name: hola mundo
        run: echo "Hola mundo"

      - name: touch file
        run: touch hola.txt

      - name: Set text
        run: echo "Hola mundo" >> hola.txt

      - name: Read file
        run: cat hola.txt

  other: #otro trabajo 
    runs-on: ubuntu-latest
    needs: hola
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7      
      - name: LS
        run: ls -al
      #- name: Script
        #run: |
          # chmod +x script.sh
          #./script.sh

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.4
        with:
          node-version: latest #asignamos la version
      
      - name: node version
        run: node --version

      #- name: install
      #  run: npm install

      #si queremos configurar php
      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: node version
        run: php --version

      - name: ls
        uses: ./.github/actions/my-action #usamos un action que esta en la carpeta .github/actions/my-action
        #shell: bash en el workflow no se pone pero si en la action
        with: 
          message: "Pablo"
