name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Se ejecuta en cada push a main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas
        run: npm test

  build:
    runs-on: ubuntu-latest # Se ejecuta en una máquina virtual con Ubuntu
    needs: test  # No se ejecuta hasta que 'test' haya finalizado con éxito

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4 # Clona el repositorio en la máquina virtual

      - name: Instalar dependencias
        run: npm install

      - name: Construir el proyecto
        run: npm run build  # Genera los archivos listos para producción

  deploy:
    runs-on: ubuntu-latest
    needs: build  # No se ejecuta hasta que 'build' haya finalizado con éxito

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Desplegar en producción
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key && chmod 600 private_key
          ssh -i private_key $SERVER_USER@$SERVER_HOST "cd /var/www/app && git pull && npm install && npm run start"
