name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  build-and-push: # Trabajo para construir y subir la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Autenticarse en Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Construir imagen Docker
        run: docker build -t miusuario/miproyecto:latest .

      - name: Subir imagen a Docker Hub
        run: docker push miusuario/miproyecto:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push  # Se ejecuta después de la construcción de la imagen
    steps:
      - name: Configurar kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Aplicar despliegue a Kubernetes
        run: kubectl apply -f k8s/deployment.yaml
